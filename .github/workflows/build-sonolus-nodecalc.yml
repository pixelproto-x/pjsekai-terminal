name: Rebuild Sonolus NodeCalc with stream functions

on:
  push:
    branches: ["main"]
    paths:
      - "sonolus-web/nodecalc-src/**"
      - ".github/workflows/build-sonolus-nodecalc.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install AssemblyScript and Playwright
        run: npm install --no-save assemblyscript@0.27.29 playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Compile WebAssembly runtime
        run: |
          npx asc --config sonolus-web/nodecalc-src/asconfig.json --target release
          test -s sonolus-web/assets/node_calc.wasm
          node -e "const fs=require('fs');const b=fs.readFileSync('sonolus-web/assets/node_calc.wasm');if(b[0]!==0||b[1]!==97||b[2]!==115||b[3]!==109)process.exit(1);if(!WebAssembly.validate(b))process.exit(2);console.log('node_calc.wasm valid:',b.length,'bytes')"

      - name: Start local QA server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/dojo-http.log 2>&1 &
          echo $! > /tmp/dojo-http.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dojo-http.log
          exit 1

      - name: Verify audio endpoint
        run: |
          curl -L --fail --silent --show-error --range 0-255 -D /tmp/audio.headers -o /tmp/audio.sample "https://storage.sekai.best/sekai-jp-assets/music/long/0001_01/0001_01.wav"
          file /tmp/audio.sample

      - name: Test the newly compiled runtime in real Chromium
        run: node scripts/test-dojo-browser.mjs

      - name: Commit compiled runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sonolus-web/assets/node_calc.wasm
          if git diff --cached --quiet; then
            echo "Compiled runtime is already up to date."
            exit 0
          fi
          git commit -m "Update Sonolus Web runtime with stream function support"
          git push
