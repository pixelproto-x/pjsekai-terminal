name: UI redesign smoke tests

on:
  push:
    branches: ["cleanup/keep-ui-player-lookup"]
  pull_request:
    branches: ["main"]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run minimal player hub UI tests
        run: node --test tests/ui/*.test.mjs
