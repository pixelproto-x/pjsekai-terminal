name: UI redesign smoke tests

on:
  push:
    branches: ["redesign/6th-anniversary-ui"]
  pull_request:
    branches: ["main"]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check redesigned interface and preserved modules
        run: node scripts/test-ui-redesign.mjs
