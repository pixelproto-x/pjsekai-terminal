name: Record 150-second site demo

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/record-site-demo.mjs"
      - ".github/workflows/record-site-demo.yml"

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Record the real browser tour and render 150-second MP4
        env:
          DEMO_BASE_URL: https://pixelproto-x.github.io/pjsekai-terminal/
          DEMO_OUT_DIR: recording-output
        run: node scripts/record-site-demo.mjs

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: pjsekai-terminal-demo-150s
          path: recording-output/pjsekai-terminal-demo-150s.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Upload Dojo diagnostics on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pjsekai-terminal-demo-diagnostics
          path: recording-output/diagnostics/*.png
          if-no-files-found: ignore
          retention-days: 3
