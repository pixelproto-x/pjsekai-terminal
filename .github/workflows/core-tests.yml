name: Core refactor tests

on:
  push:
    branches: ["refactor/player-hub-core"]
  pull_request:
    branches: ["main"]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run core unit tests
        run: node --test tests/core/*.test.mjs
