name: Core refactor tests

on:
  push:
    branches: ["main", "cleanup/keep-ui-player-lookup"]
  pull_request:
    branches: ["main"]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run core unit tests
        run: |
          node --check app-shell.js
          node --check language.js
          node --check player-lookup.js
          node --check player-workspace.js
          node --check game-tools.js
          node --check src/data/game-database.mjs
          node --test tests/core/*.test.mjs tests/data/*.test.mjs tests/ui/*.test.mjs
      - name: Check Haruki Worker syntax and startup script
        working-directory: workers/player-api
        run: |
          node --check src/index.js
          node --check src/routes.mjs
      - name: Run Haruki Worker route tests
        working-directory: workers/player-api
        run: node --test test/*.test.mjs
