name: Dojo direct play browser test

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "dojo-webgl.js"
      - "dojo-*.json"
      - "dojo-skin.json"
      - "scripts/test-dojo-browser.mjs"
      - "scripts/build-dojo-static-data.mjs"
      - "tailwind.config.js"
      - "tailwind.input.css"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dojo-browser
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Dojo song and vocal data
        run: node scripts/build-dojo-static-data.mjs

      - name: Build production CSS
        run: npx --yes tailwindcss@3.4.17 -c tailwind.config.js -i ./tailwind.input.css -o ./tailwind.css --minify

      - name: Install browser test dependency
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/pjsekai-http.log 2>&1 &
          echo $! >/tmp/pjsekai-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pjsekai-http.log
          exit 1

      - name: Run Dojo browser test
        run: node scripts/test-dojo-browser.mjs
