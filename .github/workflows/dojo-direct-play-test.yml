name: Dojo direct play browser test

on:
  push:
    branches: ["main", "dojo-direct-play-test"]

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/dojo-http.log 2>&1 &
          echo $! > /tmp/dojo-http.pid
      - name: Verify browser audio asset
        run: |
          curl -L --fail --silent --show-error --range 0-255 -D /tmp/audio.headers -o /tmp/audio.sample "https://storage.sekai.best/sekai-jp-assets/music/long/0001_01/0001_01.wav"
          cat /tmp/audio.headers
          file /tmp/audio.sample
      - name: Verify browser image asset and proxy sources
        run: |
          echo "=== source image ==="
          curl -L --fail --silent --show-error -D /tmp/cover.headers -o /tmp/cover.sample "https://storage.sekai.best/sekai-jp-assets/thumbnail/music/jacket_s_001_normal.webp"
          cat /tmp/cover.headers
          file /tmp/cover.sample
          echo "=== wsrv full https ==="
          curl -L --fail --silent --show-error -D /tmp/wsrv.headers -o /tmp/wsrv.sample "https://wsrv.nl/?url=https%3A%2F%2Fstorage.sekai.best%2Fsekai-jp-assets%2Fthumbnail%2Fmusic%2Fjacket_s_001_normal.webp&w=96&h=96&fit=cover&output=webp"
          cat /tmp/wsrv.headers
          file /tmp/wsrv.sample
          echo "=== images.weserv https ==="
          curl -L --fail --silent --show-error -D /tmp/weserv.headers -o /tmp/weserv.sample "https://images.weserv.nl/?url=https%3A%2F%2Fstorage.sekai.best%2Fsekai-jp-assets%2Fthumbnail%2Fmusic%2Fjacket_s_001_normal.webp&w=96&h=96&fit=cover&output=webp"
          cat /tmp/weserv.headers
          file /tmp/weserv.sample
      - name: Run Dojo browser test
        run: node scripts/test-dojo-browser.mjs
