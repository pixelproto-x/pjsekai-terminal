name: Deploy Haruki v6 player API

on:
  workflow_dispatch:

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        working-directory: workers/player-api
        run: node --check src/index.js
      - name: Run route tests
        working-directory: workers/player-api
        run: node --test test/*.test.mjs
      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not available."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not available."
            exit 1
          fi
          echo "Cloudflare deployment credentials are available."
      - name: Deploy Haruki v6 container and Worker
        working-directory: workers/player-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Verify live Haruki version and five regions
        shell: bash
        env:
          WORKER_URL: https://pjsekai-player-api.a0983439343.workers.dev
        run: |
          response="$(curl --fail --silent --show-error --max-time 180 \
            -H "Origin: https://pixelproto-x.github.io" "$WORKER_URL/health")"
          node -e '
            const data = JSON.parse(process.argv[1]);
            const regions = ["jp", "tw", "en", "kr", "cn"];
            if (data.version !== "6.33.0" || data.status !== "ok") {
              throw new Error("Haruki is not fully healthy: " + JSON.stringify(data));
            }
            for (const region of regions) {
              if (!data.regions?.[region] || data.regions[region].sessions < 1 || data.regions[region].gated) {
                throw new Error("Region is not ready: " + region);
              }
            }
          ' "$response"
