name: Deploy free player API

on:
  push:
    branches: ["main"]
    paths:
      - "workers/player-api/**"
      - ".github/workflows/deploy-player-api.yml"
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        working-directory: workers/player-api
        run: |
          node --check src/index.js
          node --check src/routes.mjs
      - name: Run Worker tests
        working-directory: workers/player-api
        run: node --test test/*.test.mjs
      - name: Verify free Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          echo "Cloudflare deployment credentials are available."
      - name: Deploy plain Worker (no Containers or Durable Objects)
        working-directory: workers/player-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Verify Worker health
        env:
          WORKER_URL: https://pjsekai-player-api.a0983439343.workers.dev
        run: |
          curl --fail --silent --show-error --max-time 20 \
            -H "Origin: https://pixelproto-x.github.io" "$WORKER_URL/health" \
            -o health.json
          node -e '
            const data = require("./health.json");
            const expected = ["jp", "tw", "en", "kr", "cn"].sort();
            if (data.status !== "ok" || data.runtime !== "Cloudflare Workers Free") {
              throw new Error("Free Worker health check failed: " + JSON.stringify(data));
            }
            if (JSON.stringify([...data.regions].sort()) !== JSON.stringify(expected)) {
              throw new Error("The Worker does not advertise all five regions.");
            }
          '
      - name: Probe all five public profile upstreams
        env:
          WORKER_URL: https://pjsekai-player-api.a0983439343.workers.dev
        shell: bash
        run: |
          failed=0
          for region in jp tw en kr cn; do
            status="000"
            for attempt in 1 2; do
              status="$(curl --silent --show-error --max-time 25 \
                -H "Origin: https://pixelproto-x.github.io" \
                -o "/tmp/profile-$region.json" -w "%{http_code}" \
                "$WORKER_URL/api/$region/user/1/profile" || true)"
              case "$status" in
                200|403|404|429) break ;;
                *) sleep 1 ;;
              esac
            done
            echo "$region upstream HTTP $status"
            case "$status" in
              200|403|404|429) ;;
              *)
                cat "/tmp/profile-$region.json" 2>/dev/null || true
                echo "::warning::$region public upstream is currently unavailable."
                failed=1
                ;;
            esac
          done

          sample_status="$(curl --silent --show-error --max-time 25 \
            -H "Origin: https://pixelproto-x.github.io" \
            -o /tmp/tw-sample-profile.json -w "%{http_code}" \
            "$WORKER_URL/api/tw/user/7014633806900763393/profile" || true)"
          echo "Documented HiSekai Taiwan sample profile HTTP $sample_status"
          if [[ "$sample_status" == "200" ]]; then
            node -e '
              const p = require("/tmp/tw-sample-profile.json");
              if (!p.data || p.region !== "tw") throw new Error("Unexpected TW profile payload");
              console.log("Taiwan sample profile payload validated; source:", p.source);
            '
          fi
          if [[ "$failed" -ne 0 ]]; then
            echo "::error::One or more regional public upstreams did not respond successfully."
            exit 1
          fi
