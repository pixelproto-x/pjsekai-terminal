name: Deploy player API Worker

on:
  push:
    branches: ["main"]
    paths:
      - "workers/player-api/**"
      - ".github/workflows/deploy-player-api.yml"
  pull_request:
    paths:
      - "workers/player-api/**"
      - ".github/workflows/deploy-player-api.yml"
  workflow_dispatch:

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        working-directory: workers/player-api
        run: node --check src/index.js
      - name: Run Worker tests
        working-directory: workers/player-api
        run: node --test test/*.test.mjs
      - name: Verify Cloudflare deployment credentials
        if: ${{ github.event_name != 'pull_request' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not available to this workflow."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not available to this workflow."
            exit 1
          fi
          echo "Both Cloudflare deployment credentials are available."
      - name: Deploy Cloudflare Worker
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: workers/player-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
