<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sonolus Web Player｜Project SEKAI 特訓核心</title><link rel="stylesheet" href="https://raw.githubusercontent.com/1217pond/sonolus-web-player/58c2e201a9554d7e4e43704c88ecf73c42933d80/assets/index.css"></head><body><div id="loading-cover" class="loading-cover"><div class="loading-window"><div class="circle"></div><div class="loading-text">LOADING...</div></div></div><div id="processing-cover" class="loading-cover" style="display:none"><div class="processing-window"><canvas id="progress-window" width="520" height="30" style="display:none"></canvas><div class="circle"></div><div class="loading-text">PROCESSING...</div></div></div><div id="root"></div><div id="player-window" hidden></div>
<script>
/*
 * GitHub Pages serves raw GitHub WASM responses with a MIME type that can
 * make instantiateStreaming/compileStreaming reject the response. Keep the
 * upstream bundle unchanged, but transparently fall back to ArrayBuffer
 * instantiation when the browser rejects the response MIME type.
 */
(() => {
  const originalInstantiateStreaming = WebAssembly.instantiateStreaming;
  if (typeof originalInstantiateStreaming === 'function') {
    WebAssembly.instantiateStreaming = async (source, imports) => {
      const response = await source;
      try {
        return await originalInstantiateStreaming(response, imports);
      } catch (error) {
        if (response && typeof response.arrayBuffer === 'function') {
          return WebAssembly.instantiate(await response.arrayBuffer(), imports);
        }
        throw error;
      }
    };
  }

  const originalCompileStreaming = WebAssembly.compileStreaming;
  if (typeof originalCompileStreaming === 'function') {
    WebAssembly.compileStreaming = async source => {
      const response = await source;
      try {
        return await originalCompileStreaming(response);
      } catch (error) {
        if (response && typeof response.arrayBuffer === 'function') {
          return WebAssembly.compile(await response.arrayBuffer());
        }
        throw error;
      }
    };
  }
})();
</script><script src="https://raw.githubusercontent.com/1217pond/sonolus-web-player/58c2e201a9554d7e4e43704c88ecf73c42933d80/zlib/gunzip.min.js"></script><script src="https://raw.githubusercontent.com/1217pond/sonolus-web-player/58c2e201a9554d7e4e43704c88ecf73c42933d80/zlib/unzip.min.js"></script><script type="module" src="./assets/index.js"></script></body></html>
