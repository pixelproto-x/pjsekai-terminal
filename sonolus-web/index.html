<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sonolus Web Player｜Project SEKAI 特訓核心</title><link rel="stylesheet" href="./assets/index.css"></head><body><div id="loading-cover" class="loading-cover"><div class="loading-window"><div class="circle"></div><div class="loading-text">LOADING...</div></div></div><div id="processing-cover" class="loading-cover" style="display:none"><div class="processing-window"><canvas id="progress-window" width="520" height="30" style="display:none"></canvas><div class="circle"></div><div class="loading-text">PROCESSING...</div></div></div><div id="root"></div><div id="player-window" hidden></div>
<script>
/*
 * GitHub Pages serves raw GitHub WASM responses with a MIME type that can
 * make instantiateStreaming/compileStreaming reject the response. Keep the
 * upstream bundle unchanged, but transparently fall back to ArrayBuffer
 * instantiation when the browser rejects the response MIME type.
 */
(() => {
  const originalInstantiateStreaming = WebAssembly.instantiateStreaming;
  if (typeof originalInstantiateStreaming === 'function') {
    WebAssembly.instantiateStreaming = async (source, imports) => {
      const response = await source;
      try {
        return await originalInstantiateStreaming(response, imports);
      } catch (error) {
        if (response && typeof response.arrayBuffer === 'function') {
          return WebAssembly.instantiate(await response.arrayBuffer(), imports);
        }
        throw error;
      }
    };
  }

  const originalCompileStreaming = WebAssembly.compileStreaming;
  if (typeof originalCompileStreaming === 'function') {
    WebAssembly.compileStreaming = async source => {
      const response = await source;
      try {
        return await originalCompileStreaming(response);
      } catch (error) {
        if (response && typeof response.arrayBuffer === 'function') {
          return WebAssembly.compile(await response.arrayBuffer());
        }
        throw error;
      }
    };
  }
})();

/* GitHub Pages fallback: some Sonolus runtime data asks for /textures/system_tex.webp.
 * The actual asset is bundled beside this player at ./textures/system_tex.webp.
 */
(() => {
  const localSystemTexture = () => new URL('./textures/system_tex.webp', document.baseURI).href;
  const shouldRedirect = input => {
    try {
      const url = new URL(typeof input === 'string' ? input : input.url, location.href);
      return url.pathname === '/textures/system_tex.webp';
    } catch (_) { return false; }
  };

  const originalFetch = window.fetch.bind(window);
  window.fetch = (input, init) => {
    if (shouldRedirect(input)) return originalFetch(localSystemTexture(), init);
    return originalFetch(input, init);
  };

  const originalOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function(method, url, ...rest) {
    if (shouldRedirect(url)) url = localSystemTexture();
    return originalOpen.call(this, method, url, ...rest);
  };

  // Some Sonolus runtime loaders create Image elements directly instead of
  // going through fetch/XHR. Rewrite the absolute root asset path there too.
  const imageSrc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
  if (imageSrc && imageSrc.get && imageSrc.set) {
    Object.defineProperty(HTMLImageElement.prototype, 'src', {
      configurable: imageSrc.configurable,
      enumerable: imageSrc.enumerable,
      get: imageSrc.get,
      set(value) {
        imageSrc.set.call(this, shouldRedirect(value) ? localSystemTexture() : value);
      }
    });
  }

  const originalSetAttribute = Element.prototype.setAttribute;
  Element.prototype.setAttribute = function(name, value) {
    if (String(name).toLowerCase() === 'src' && shouldRedirect(value)) {
      value = localSystemTexture();
    }
    return originalSetAttribute.call(this, name, value);
  };
})();
</script><script src="./zlib/gunzip.min.js"></script><script src="./zlib/unzip.min.js"></script><script type="module" src="./assets/index.js"></script></body></html>
